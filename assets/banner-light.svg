 calcMode="discrete" keyTimes="0.0000;0.3333;0.5000" values="0;1;0"/></rect><clipPath id="r3"><rect x="128" y="186" height="44" width="0"><animate attributeName="width" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5500;0.6417;0.6667;1.0000" values="0;0;328.0;328.0;0;0" calcMode="linear"/></rect></clipPath><text x="130" y="219" class="role" clip-path="url(#r3)">Product Management</text><rect y="192" width="3" height="32" fill="#0a66c2" x="130" opacity="0"><animate attributeName="x" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.5000;0.5500;0.6417;0.6667;1.0000" values="130;130;458.0;458.0;130;130"/><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.5000;0.6667" values="0;1;0"/></rect><clipPath id="r4"><rect x="128" y="186" height="44" width="0"><animate attributeName="width" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.7167;0.8083;0.8333;1.0000" values="0;0;310.0;310.0;0;0" calcMode="linear"/></rect></clipPath><text x="130" y="219" class="role" clip-path="url(#r4)">Product Analytics</text><rect y="192" width="3" height="32" fill="#0a66c2" x="130" opacity="0"><animate attributeName="x" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.6667;0.7167;0.8083;0.8333;1.0000" values="130;130;440.0;440.0;130;130"/><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.6667;0.8333" values="0;1;0"/></rect><clipPath id="r5"><rect x="128" y="186" height="44" width="0"><animate attributeName="width" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.8333;0.8833;0.9750;1.0000" values="0;0;184.0;184.0;0" calcMode="linear"/></rect></clipPath><text x="130" y="219" class="role" clip-path="url(#r5)">Consulting</text><rect y="192" width="3" height="32" fill="#0a66c2" x="130" opacity="0"><animate attributeName="x" dur="18.0s" repeatCount="indefinite" keyTimes="0.0000;0.8333;0.8833;0.9750;1.0000" values="130;130;314.0;314.0;130"/><animate attributeName="opacity" dur="18.0s" repeatCount="indefinite" calcMode="discrete" keyTimes="0.0000;0.8333" values="0;1"/></rect>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#d0d7de"/>
