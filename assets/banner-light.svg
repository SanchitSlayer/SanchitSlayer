<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Sanchit Garg: AI Engineering, Product, Consulting">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6f8ff"/><stop offset="1" stop-color="#eef1fb"/>
  </linearGradient>
  <radialGradient id="g1" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#54aeff" stop-opacity="0.55"/><stop offset="1" stop-color="#54aeff" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#c297ff" stop-opacity="0.5"/><stop offset="1" stop-color="#c297ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="nm" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#0a66c2"/>
  </linearGradient>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#0a2540" stroke-opacity="0.06"/>
  </pattern>
  <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
</defs>
<style>
  .name { font: 800 64px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: -1px; }
  .sub { font: 500 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #57606a; }
  .role { font: 600 30px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #0a66c2; }
  .prompt { font: 600 30px ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; fill: #8250df; }
  .in { animation: up .8s ease-out backwards; }
  @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
</style>
<g clip-path="url(#card)">
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <circle cx="1010" cy="70" r="230" fill="url(#g1)">
    <animate attributeName="cy" values="70;110;70" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="860" cy="280" r="200" fill="url(#g2)">
    <animate attributeName="cx" values="860;920;860" dur="11s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#0a66c2" stroke-opacity="0.35" stroke-width="1.5">
    <path d="M900 150 L980 110 L1060 160 L1130 120"/>
    <path d="M980 110 L1010 200 L1060 160"/>
  </g>
  <g fill="#0a66c2">
